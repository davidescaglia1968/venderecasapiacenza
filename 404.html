<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata | Immobiliare Scaglia Piacenza</title>
<meta name="robots" content="noindex">

<style>:root{--nero:#1c1a17;--bianco:#fdfcf9;--oro:#B8860B;--oro-scuro:#8B6508;--grigio:#7a7570;--grigio-chiaro:#f2ede3;--radius:8px;--radius-lg:16px;}*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'DM Sans',sans-serif;background:var(--nero);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 5%;-webkit-font-smoothing:antialiased;}.wrap{max-width:600px;}.big{font-family:'Playfair Display',serif;font-size:clamp(80px,15vw,160px);font-weight:900;color:rgba(184,134,11,0.15);line-height:1;margin-bottom:0;}h1{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,40px);font-weight:700;margin-bottom:14px;}h1 em{color:var(--oro);font-style:italic;}p{color:rgba(255,255,255,0.55);font-size:16px;line-height:1.7;margin-bottom:32px;}.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}.btn-gold{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--oro),var(--oro-scuro));color:var(--nero);padding:13px 28px;font-size:14px;font-weight:700;border-radius:var(--radius);text-decoration:none;transition:all 0.25s;}.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(184,134,11,0.45);}.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:rgba(255,255,255,0.75);padding:13px 28px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,0.18);border-radius:var(--radius);text-decoration:none;transition:all 0.25s;}.btn-ghost:hover{border-color:var(--oro);color:var(--oro);}</style>
</head>
<body>
<div class="wrap">
  <div class="big">404</div>
  <h1>Pagina <em>non trovata</em></h1>
  <p>La pagina che cerchi non esiste o è stata spostata. Torna alla home o esplora le guide e le analisi di mercato di Piacenza.</p>
  <div class="links">
    <a href="/" class="btn-gold">→ Torna alla Home</a>
    <a href="/blog/" class="btn-ghost">Blog & Analisi</a>
    <a href="/guide/" class="btn-ghost">Guide Pratiche</a>
  </div>
</div>
</body>
</html>
