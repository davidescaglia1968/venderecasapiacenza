<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata | Immobiliare Scaglia Piacenza</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet"></noscript>
<style>
:root{--nero:#1c1a17;--bianco:#fdfcf9;--oro:#B8860B;--oro-chiaro:#d4a520;--oro-scuro:#8B6508;--grigio:#5f5a55;--grigio-chiaro:#f2ede3;--radius:8px;--radius-lg:16px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--nero);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 5%;-webkit-font-smoothing:antialiased;}
.wrap{max-width:600px;}
.big{font-family:'Playfair Display',serif;font-size:clamp(80px,15vw,160px);font-weight:900;color:rgba(212,165,32,0.62);line-height:1;margin-bottom:0;}
h1{font-family:'Playfair Display',serif;font-size:clamp(24px,4vw,40px);font-weight:700;margin-bottom:14px;}
h1 em{color:var(--oro-chiaro);font-style:italic;}
p{color:rgba(255,255,255,0.78);font-size:16px;line-height:1.7;margin-bottom:32px;}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-gold{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--oro-chiaro),var(--oro));color:var(--nero);padding:13px 28px;font-size:14px;font-weight:700;border-radius:var(--radius);text-decoration:none;transition:all 0.25s;}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(184,134,11,0.45);}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:rgba(255,255,255,0.85);padding:13px 28px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,0.22);border-radius:var(--radius);text-decoration:none;transition:all 0.25s;}
.btn-ghost:hover{border-color:var(--oro-chiaro);color:var(--oro-chiaro);}
</style>
</head>
<body>
<main class="wrap" id="main-content">
  <div class="big" aria-hidden="true">404</div>
  <h1>Pagina <em>non trovata</em></h1>
  <p>La pagina che cerchi non esiste o è stata spostata. Torna alla home o esplora il Magazine e la consulenza immobiliare di Piacenza.</p>
  <div class="links">
    <a href="/" class="btn-gold">→ Torna alla Home</a>
    <a href="/blog" class="btn-ghost">Magazine & Analisi</a>
    <a href="/wizard" class="btn-ghost">Valuta il tuo immobile</a>
  </div>
</main>
</body>
</html>
